# Plain manifests, for clusters not using the ExternalDNS Helm chart.
# Create the Secret first:
#
#   kubectl -n external-dns create secret generic akamai-edgedns \
#     --from-literal=AKAMAI_SERVICECONSUMERDOMAIN=... \
#     --from-literal=AKAMAI_CLIENT_TOKEN=... \
#     --from-literal=AKAMAI_CLIENT_SECRET=... \
#     --from-literal=AKAMAI_ACCESS_TOKEN=...
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-dns
  namespace: external-dns
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: external-dns
rules:
  - apiGroups: [""]
    resources: ["services", "endpoints", "pods"]
    verbs: ["get", "watch", "list"]
  # ExternalDNS reads EndpointSlices, not the deprecated Endpoints, since v0.22.
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "watch", "list"]
  - apiGroups: ["extensions", "networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "watch", "list"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: external-dns-viewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: external-dns
subjects:
  - kind: ServiceAccount
    name: external-dns
    namespace: external-dns
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-dns
  namespace: external-dns
  labels:
    app.kubernetes.io/name: external-dns
spec:
  # ExternalDNS is not leader-elected here. A second replica would race the first
  # one on the same zones and double the Edge DNS call volume for nothing.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: external-dns
  template:
    metadata:
      labels:
        app.kubernetes.io/name: external-dns
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: external-dns
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: external-dns
          image: registry.k8s.io/external-dns/external-dns:v0.22.0
          args:
            - --source=ingress
            - --source=service
            - --provider=webhook
            - --registry=txt
            - --txt-owner-id=external-dns
            - --txt-prefix=extdns-
            - --policy=sync
            - --interval=1m
          ports:
            - name: http
              containerPort: 7979
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]

        - name: webhook
          image: ghcr.io/pixibixi/external-dns-akamai-webhook:v0.1.0
          args:
            - --domain-filter=example.com
            - --zones-cache-duration=5m
            - --log-format=json
          env:
            # Credentials stay out of the args: those are visible in the pod spec
            # and in every `kubectl describe`.
            - name: AKAMAI_SERVICECONSUMERDOMAIN
              valueFrom:
                secretKeyRef:
                  name: akamai-edgedns
                  key: AKAMAI_SERVICECONSUMERDOMAIN
            - name: AKAMAI_CLIENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: akamai-edgedns
                  key: AKAMAI_CLIENT_TOKEN
            - name: AKAMAI_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: akamai-edgedns
                  key: AKAMAI_CLIENT_SECRET
            - name: AKAMAI_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: akamai-edgedns
                  key: AKAMAI_ACCESS_TOKEN
          ports:
            # 8888 is not declared: the webhook API listens on localhost only and
            # is reachable from the ExternalDNS container through the shared
            # network namespace, never from outside the pod.
            - name: http-webhook
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: http-webhook
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http-webhook
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]

# Annotating a Service or an Ingress, since ExternalDNS v0.22:
#
#   external-dns.kubernetes.io/hostname: app.example.com
#   external-dns.kubernetes.io/ttl: "300"
#
# The prefix lost its `alpha` in v0.22. Most examples still carry
# external-dns.alpha.kubernetes.io/, which v0.22 silently ignores: the source
# logs "No endpoints could be generated" and nothing is ever created.
