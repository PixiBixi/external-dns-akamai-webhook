version: 2

before:
  hooks:
    - go mod tidy
    - go mod verify

builds:
  - id: external-dns-akamai-webhook
    binary: external-dns-akamai-webhook
    main: .
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s   # implies -w
      - -X main.version={{.Version}}

archives:
  - id: default
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - README.md
      - LICENSE
      - NOTICE

# The primary artifact is the image: this runs as a sidecar of the ExternalDNS
# pod. ko cross-compiles and packs a distroless image without a Dockerfile, a
# daemon or buildx, and publishes the multi-arch manifest itself.
# goos: linux only. UPX decompresses the whole binary at every exec, which a
# long-lived server pays once at start and a one-shot CLI would pay every run
# (klens: 5.8 ms to 669 ms). See the goreleaser article on the wiki.
upx:
  - enabled: true
    ids: [external-dns-akamai-webhook]
    compress: best
    lzma: true
    goos: [linux]

kos:
  - id: image
    build: external-dns-akamai-webhook
    main: .   # required since Go 1.27, an empty main reaches ko as ""
    repositories:
      - ghcr.io/pixibixi/external-dns-akamai-webhook
    base_image: gcr.io/distroless/static:nonroot
    platforms:
      - linux/amd64
      - linux/arm64
    tags:
      - "{{ .Version }}"
      - "{{ .Major }}.{{ .Minor }}"
      - "{{ .Major }}"
      - '{{ if not .Prerelease }}latest{{ end }}'
    bare: true
    labels:
      org.opencontainers.image.source: "{{ .GitURL }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.licenses: Apache-2.0

# syft over each archive: the release says what is inside an artifact, not only
# how it was built.
sboms:
  - artifacts: archive

# Keyless, so there is no private key to store or rotate: the identity comes from
# the GitHub OIDC token and lands in the Sigstore transparency log.
#
# Signing checksums.txt covers every archive at once, since it holds their
# SHA256. cosign v3 writes one .sigstore.json bundle instead of the old .sig plus
# .pem pair, so verification is `cosign verify-blob --bundle <file>.sigstore.json`.
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum

# --recursive covers the per-arch images behind the manifest list ko published.
docker_signs:
  - cmd: cosign
    artifacts: manifests
    output: true
    args: ["sign", "-y", "--recursive", "${artifact}"]

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  # -1 drops the commit SHA from the entry. A list of 40-character hashes is a
  # git log in disguise, which is what release notes are meant not to be.
  abbrev: -1
  filters:
    # The scope is optional in Conventional Commits and these patterns must
    # allow it: '^docs:' never matched 'docs(wiki):', so every excluded type
    # was leaking into the notes.
    exclude:
      - '^docs(\([^)]*\))?:'
      - '^test(\([^)]*\))?:'
      - '^chore(\([^)]*\))?:'
      - '^ci(\([^)]*\))?:'
      - 'typo'
  groups:
    - title: Features
      regexp: '^feat'
      order: 0
    - title: Bug Fixes
      regexp: '^fix'
      order: 1
    - title: Others
      order: 999

release:
  github:
    owner: PixiBixi
    name: external-dns-akamai-webhook
  name_template: "{{.ProjectName}} {{.Version}}"
  header: |
    Run as a sidecar of the ExternalDNS pod:

    ```
    ghcr.io/pixibixi/external-dns-akamai-webhook:{{ .Version }}
    ```

    [Install](https://github.com/PixiBixi/external-dns-akamai-webhook#install) -
    [Flags](https://github.com/PixiBixi/external-dns-akamai-webhook#flags) -
    [Verifying this release](https://github.com/PixiBixi/external-dns-akamai-webhook#verifying-a-release)
  draft: false
  prerelease: auto
  mode: replace
