name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write
  packages: write       # push the image to ghcr
  id-token: write       # keyless identity for the cosign signature and the attestation
  attestations: write   # store the attestation on the repo

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # release publishes artifacts; avoid cache-poisoning vector

      # svu derives the next version from the conventional commits since the last
      # tag, and prints the current one back when nothing warrants a release --
      # which is the gate below. --v0 keeps a breaking change on a 0.x project
      # from jumping straight to v1.0.0.
      - name: Compute next version
        id: tag
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # renovate: datasource=github-releases depName=caarlos0/svu
          SVU_VERSION: v3.4.1
        run: |
          set -euo pipefail
          GOBIN="${RUNNER_TEMP}/bin" go install "github.com/caarlos0/svu/v3@${SVU_VERSION}"
          svu="${RUNNER_TEMP}/bin/svu"

          current=$("$svu" current)
          next=$("$svu" next --v0)
          if [ "$next" = "$current" ]; then
            echo "No releasable commit since ${current} - nothing to do."
            exit 0
          fi

          echo "Tagging ${next} (previous: ${current})"
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f "ref=refs/tags/${next}" -f "sha=${GITHUB_SHA}" --silent
          echo "new_tag=${next}" >> "$GITHUB_OUTPUT"

      # The tag was created through the API, so the local clone needs it before
      # goreleaser can read the version off it.
      - name: Fetch tags
        if: github.ref_type == 'tag' || steps.tag.outputs.new_tag != ''
        run: git fetch --tags --force

      # ko authenticates to ghcr on its own with the GITHUB_TOKEN, but cosign
      # does not: docker_signs pushes the signature layer to the same registry
      # and reads ~/.docker/config.json for that. Without this the image is
      # published and then the signing step fails on UNAUTHORIZED.
      - uses: docker/login-action@06fb636fac595d6fb4b28a5dfcb21a6f5091859c # v4.5.0
        if: github.ref_type == 'tag' || steps.tag.outputs.new_tag != ''
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # goreleaser-action verifies the cosign signature of the goreleaser binary
      # it downloads; without cosign on PATH it silently skips that check. It is
      # also what docker_signs calls to sign the manifest list.
      - name: Install cosign
        if: github.ref_type == 'tag' || steps.tag.outputs.new_tag != ''
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install syft
        if: github.ref_type == 'tag' || steps.tag.outputs.new_tag != ''
        uses: anchore/sbom-action/download-syft@8e94d75ddd33f69f691467e42275782e4bfefe84 # v0.20.9

      - name: Run GoReleaser
        if: github.ref_type == 'tag' || steps.tag.outputs.new_tag != ''
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A signature says who published; provenance says how it was built (repo,
      # workflow, commit). Verified with `gh attestation verify <file> --repo`.
      - name: Attest build provenance
        if: github.ref_type == 'tag' || steps.tag.outputs.new_tag != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/*.tar.gz,dist/checksums.txt,dist/*.sbom.json'
