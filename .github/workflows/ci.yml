name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-26.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The Release job installs svu with this same toolchain: fail on the PR
      # when a svu bump needs a newer go directive, not after the merge.
      - name: Check svu installs with this toolchain
        run: |
          set -euo pipefail
          SVU_VERSION=$(sed -n 's/^ *SVU_VERSION: *//p' .github/workflows/release.yml)
          test -n "$SVU_VERSION"
          GOBIN="${RUNNER_TEMP}/bin" go install "github.com/caarlos0/svu/v3@${SVU_VERSION}"
      - name: Verify dependencies
        run: go mod verify
      - name: Build
        run: go build -v ./...
      - name: Tests
        run: go run gotest.tools/gotestsum@v1.13.0 --junitfile junit.xml -- -race -coverprofile=coverage.out ./...
      # annotate_only: no check run, so no checks: write and fork PRs still get annotations.
      - name: Test report
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce # v6.7.1
        with:
          report_paths: junit.xml
          annotate_only: true
      - name: Coverage summary
        run: |
          {
            echo '### Coverage'
            echo '```'
            go tool cover -func=coverage.out | tail -n 1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  fuzz:
    name: Fuzz
    runs-on: ubuntu-26.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # -fuzz takes one target at a time, hence the loop. The seed corpus already
      # runs under `go test`; this is the part that looks for new inputs.
      - name: Fuzz the untrusted parsers
        run: |
          set -euo pipefail
          go test ./internal/server/ -run FuzzNegotiate -fuzz FuzzNegotiate -fuzztime 60s
          go test ./internal/akamai/ -run FuzzCleanTargetsTXT -fuzz FuzzCleanTargetsTXT -fuzztime 60s
      # A crasher is written under testdata/fuzz/; keep it so the input can be
      # replayed locally instead of re-found.
      - name: Upload any crasher
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashers
          path: internal/**/testdata/fuzz/
          if-no-files-found: ignore
