name: Dependency review

on:
  pull_request:

permissions: {}

jobs:
  review:
    name: Review
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@bc41d900bc59d5f7dd0aa5f5a4f6c0a1b48a8fa1 # v4.9.1
        with:
          fail-on-severity: high
          # This project is Apache 2.0 and derives from an Apache 2.0 codebase.
          # A copyleft dependency would be a licensing problem, not a style one.
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0
